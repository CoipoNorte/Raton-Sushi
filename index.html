<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Ratón Sushi: un acogedor kaiten sushi bar. Prepara nigiris por capas, sirve pedidos perfectos y rompe tu récord antes de que se acabe el tiempo."
    />
    <meta name="theme-color" content="#f7ead7" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&family=Baloo+2:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Raton Sushi</title>
    <style>
      /* Splash de carga: evita pantalla en blanco en GitHub Pages */
      #splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background:
          radial-gradient(1200px 600px at 50% -10%, #fdeeda 0%, transparent 60%),
          linear-gradient(180deg, #f9ecd8 0%, #f3dfc2 100%);
        color: #6b4a2f;
        font-family: "M PLUS Rounded 1c", system-ui, sans-serif;
        font-weight: 700;
        text-align: center;
        padding: 24px;
        z-index: 9999;
      }
      #splash .bowl {
        animation: splash-bob 1.6s ease-in-out infinite;
        filter: drop-shadow(0 10px 14px rgba(107, 74, 47, 0.22));
      }
      #splash .steam {
        animation: splash-steam 1.6s ease-in-out infinite;
        opacity: 0;
      }
      #splash .steam.s2 { animation-delay: 0.35s; }
      #splash .steam.s3 { animation-delay: 0.7s; }
      #splash .dots::after {
        content: "";
        animation: splash-dots 1.2s steps(4, end) infinite;
      }
      @keyframes splash-dots {
        0% { content: ""; }
        25% { content: "."; }
        50% { content: ".."; }
        75% { content: "..."; }
      }
      @keyframes splash-bob {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-6px); }
      }
      @keyframes splash-steam {
        0% { opacity: 0; transform: translateY(4px); }
        40% { opacity: 0.8; }
        100% { opacity: 0; transform: translateY(-12px); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Splash: React lo reemplaza al montar -->
      <div id="splash" role="status" aria-live="polite">
        <svg class="bowl" width="104" height="84" viewBox="0 0 104 84" aria-hidden="true">
          <path class="steam s1" d="M38 30 q4 -8 0 -14 q-3 -5 2 -10" stroke="#cbb392" stroke-width="4" fill="none" stroke-linecap="round"/>
          <path class="steam s2" d="M52 28 q4 -8 0 -14 q-3 -5 2 -10" stroke="#cbb392" stroke-width="4" fill="none" stroke-linecap="round"/>
          <path class="steam s3" d="M66 30 q4 -8 0 -14 q-3 -5 2 -10" stroke="#cbb392" stroke-width="4" fill="none" stroke-linecap="round"/>
          <ellipse cx="52" cy="46" rx="40" ry="10" fill="#fff9ef"/>
          <circle cx="38" cy="42" r="6" fill="#fbf4e6"/>
          <circle cx="50" cy="39" r="7" fill="#fbf4e6"/>
          <circle cx="63" cy="42" r="6" fill="#fbf4e6"/>
          <path d="M14 50 h76 c0 16 -14 28 -38 28 s-38 -12 -38 -28 z" fill="#7fae7a"/>
          <path d="M22 54 q4 12 16 17" stroke="#5f8f5b" stroke-width="4" fill="none" stroke-linecap="round"/>
        </svg>
        <div style="font-size: 1.1rem; letter-spacing: 0.02em">
          Preparando el arroz de sushi<span class="dots"></span>
        </div>
        <div style="font-size: 0.8rem; opacity: 0.65">Raton Sushi · Kaiten Bar</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
